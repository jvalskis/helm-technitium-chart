suite: managed cluster Services
templates:
  - service.yaml
  - service-managed.yaml
values:
  - ../ci/cluster-managed.yaml
release:
  name: dns
  namespace: test
tests:
  - it: keeps the legacy web alias pinned to member zero
    template: service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: technitium
            app.kubernetes.io/instance: dns
            app.kubernetes.io/component: cluster-member
            statefulset.kubernetes.io/pod-name: dns-technitium-cluster-0

  - it: routes shared DNS queries to every cluster member
    template: service.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: technitium
            app.kubernetes.io/instance: dns
            app.kubernetes.io/component: cluster-member

  - it: gives ordinal zero a stable peer endpoint
    template: service-managed.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: dns-technitium-cluster-0-web
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: technitium
            app.kubernetes.io/instance: dns
            app.kubernetes.io/component: cluster-member
            statefulset.kubernetes.io/pod-name: dns-technitium-cluster-0

  - it: gives ordinal one its own peer endpoint
    template: service-managed.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: dns-technitium-cluster-1-web
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: technitium
            app.kubernetes.io/instance: dns
            app.kubernetes.io/component: cluster-member
            statefulset.kubernetes.io/pod-name: dns-technitium-cluster-1

  - it: gives ordinal two its own peer endpoint
    template: service-managed.yaml
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.name
          value: dns-technitium-cluster-2-web
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: technitium
            app.kubernetes.io/instance: dns
            app.kubernetes.io/component: cluster-member
            statefulset.kubernetes.io/pod-name: dns-technitium-cluster-2

  - it: routes the primary Service to ordinal zero by default
    template: service-managed.yaml
    documentIndex: 4
    asserts:
      - equal:
          path: metadata.name
          value: dns-technitium-primary
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: technitium
            app.kubernetes.io/instance: dns
            app.kubernetes.io/component: cluster-member
            statefulset.kubernetes.io/pod-name: dns-technitium-cluster-0

  - it: switches primary routing after a manual promotion
    template: service-managed.yaml
    documentIndex: 4
    set:
      cluster.managed.updateTargetOrdinal: 2
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: technitium
            app.kubernetes.io/instance: dns
            app.kubernetes.io/component: cluster-member
            statefulset.kubernetes.io/pod-name: dns-technitium-cluster-2
