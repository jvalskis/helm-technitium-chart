suite: managed TLS trust
templates:
  - managed-hook.yaml
  - managed-primary-controller.yaml
  - statefulset-managed.yaml
  - deployment.yaml
release:
  name: dns
  namespace: test
tests:
  - it: validates coordinator certificates by default
    template: managed-hook.yaml
    documentIndex: 5
    set: &managed
      cluster.enabled: true
      cluster.managed.enabled: true
      cluster.domain: cluster.example.test
      cluster.podNetworks: [10.244.0.0/16]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VERIFY_TLS
            value: "true"
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'managed-peer-ca')]

  - it: validates observer certificates by default
    template: managed-primary-controller.yaml
    documentIndex: 4
    set: *managed
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VERIFY_TLS
            value: "true"

  - it: mounts the specified CA key for the coordinator
    template: managed-hook.yaml
    documentIndex: 5
    set: &withCa
      <<: *managed
      cluster.managed.tls.caSecretName: local-pki-ca
      cluster.managed.tls.caKey: bundle.pem
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CA_FILE
            value: /peer-ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: managed-peer-ca
            mountPath: /peer-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: managed-peer-ca
            secret:
              secretName: local-pki-ca
              items:
                - key: bundle.pem
                  path: ca.crt

  - it: mounts the same CA bundle for the observer
    template: managed-primary-controller.yaml
    documentIndex: 4
    set: *withCa
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CA_FILE
            value: /peer-ca/ca.crt
      - equal:
          path: spec.template.spec.volumes[?(@.name == 'managed-peer-ca')].secret.secretName
          value: local-pki-ca
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == 'managed-peer-ca')].mountPath
          value: /peer-ca

  - it: makes the CA available to native cluster joins
    template: statefulset-managed.yaml
    set: *withCa
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_FILE
            value: /peer-ca/ca.crt
      - equal:
          path: spec.template.spec.volumes[?(@.name == 'managed-peer-ca')].secret.items[0].key
          value: bundle.pem
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == 'managed-peer-ca')].mountPath
          value: /peer-ca

  - it: permits an explicit self-signed test override
    template: managed-primary-controller.yaml
    documentIndex: 4
    set:
      <<: *managed
      cluster.managed.tls.verify: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VERIFY_TLS
            value: "false"

  - it: rejects a non-boolean verification setting
    template: deployment.yaml
    set:
      <<: *managed
      cluster.managed.tls.verify: "off"
    asserts:
      - failedTemplate:
          errorMessage: cluster.managed.tls.verify must be a boolean

  - it: mounts a CA bundle ConfigMap for the coordinator
    template: managed-hook.yaml
    documentIndex: 5
    set: &withCaConfigMap
      <<: *managed
      cluster.managed.tls.caConfigMapName: astralas-lan
      cluster.managed.tls.caKey: root-certs.pem
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: managed-peer-ca
            configMap:
              name: astralas-lan
              items:
                - key: root-certs.pem
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CA_FILE
            value: /peer-ca/ca.crt
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'managed-peer-ca')].secret

  - it: uses a CA ConfigMap in the observer
    template: managed-primary-controller.yaml
    documentIndex: 4
    set: *withCaConfigMap
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == 'managed-peer-ca')].configMap.name
          value: astralas-lan
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == 'managed-peer-ca')].mountPath
          value: /peer-ca
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CA_FILE
            value: /peer-ca/ca.crt

  - it: uses a CA ConfigMap in managed servers
    template: statefulset-managed.yaml
    set: *withCaConfigMap
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == 'managed-peer-ca')].configMap.items[0].key
          value: root-certs.pem
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_FILE
            value: /peer-ca/ca.crt

  - it: rejects two CA sources
    template: deployment.yaml
    set:
      <<: *withCaConfigMap
      cluster.managed.tls.caSecretName: local-pki-ca
    asserts:
      - failedTemplate:
          errorMessage: set only one of cluster.managed.tls.caSecretName and caConfigMapName

  - it: projects an existing server certificate and references its password
    template: statefulset-managed.yaml
    set: &withServerCertificate
      <<: *withCaConfigMap
      cluster.autoHttps: false
      config.webServiceEnableHttps: true
      config.webServiceUseSelfSignedCert: false
      config.webServiceTlsCertificatePath: /peer-tls/server/keystore.p12
      cluster.managed.tls.serverCertificate.secretName: cluster-server-tls
      cluster.managed.tls.serverCertificate.key: custom.pfx
      cluster.managed.tls.serverCertificate.passwordSecretName: cluster-keystore-password
      cluster.managed.tls.serverCertificate.passwordKey: passphrase
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PATH
            value: /peer-tls/server/keystore.p12
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cluster-keystore-password
                key: passphrase
      - contains:
          path: spec.template.spec.volumes
          content:
            name: managed-server-tls
            secret:
              secretName: cluster-server-tls
              defaultMode: 288
              items:
                - key: custom.pfx
                  path: server/keystore.p12
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: managed-server-tls
            mountPath: /peer-tls
            readOnly: true
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD')].value
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT')]
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == 'managed-server-tls')].subPath

  - it: keeps the server private key out of the observer
    template: managed-primary-controller.yaml
    documentIndex: 4
    set: *withServerCertificate
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'managed-server-tls')]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD')]

  - it: keeps the server private key out of the coordinator
    template: managed-hook.yaml
    documentIndex: 5
    set: *withServerCertificate
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'managed-server-tls')]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD')]

  - it: preserves PVC-based certificates when no server Secret is configured
    template: statefulset-managed.yaml
    set:
      <<: *managed
      config.webServiceTlsCertificatePath: /etc/dns/old.pfx
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name == 'managed-server-tls')]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PATH
            value: /etc/dns/old.pfx

  - it: supports an unencrypted keystore
    template: statefulset-managed.yaml
    set:
      <<: *withServerCertificate
      cluster.managed.tls.serverCertificate.passwordSecretName: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD')]

  - it: rejects automatic self-signed certificates with an existing certificate
    template: deployment.yaml
    set:
      <<: *withServerCertificate
      cluster.autoHttps: true
    asserts:
      - failedTemplate:
          errorMessage: serverCertificate requires cluster.autoHttps=false and config.webServiceUseSelfSignedCert=false

  - it: requires HTTPS with an existing certificate
    template: deployment.yaml
    set:
      <<: *withServerCertificate
      config.webServiceEnableHttps: false
    asserts:
      - failedTemplate:
          errorMessage: serverCertificate requires config.webServiceEnableHttps=true

  - it: rejects two keystore password sources
    template: deployment.yaml
    set:
      <<: *withServerCertificate
      config.webServiceTlsCertificatePassword: conflicting-password
    asserts:
      - failedTemplate:
          errorMessage: set only one of serverCertificate.passwordSecretName and config.webServiceTlsCertificatePassword

  - it: rejects a password Secret without a certificate Secret
    template: deployment.yaml
    set:
      <<: *withServerCertificate
      cluster.managed.tls.serverCertificate.secretName: ""
    asserts:
      - failedTemplate:
          errorMessage: serverCertificate.passwordSecretName requires serverCertificate.secretName

  - it: rejects paths as Secret keys
    template: deployment.yaml
    set:
      <<: *withServerCertificate
      cluster.managed.tls.serverCertificate.key: ../keystore.p12
    asserts:
      - failedTemplate:
          errorMessage: serverCertificate.key must be a valid Secret key
