suite: managed cluster hooks without progress storage
templates:
  - managed-hook.yaml
values:
  - ../ci/cluster-managed.yaml
release:
  name: dns
  namespace: test
tests:
  - it: grants only read access to existing StatefulSets
    documentIndex: 1
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [apps]
              resources: [statefulsets]
              verbs: [list]
  - it: disables the coordinator Kubernetes token
    documentIndex: 5
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - notExists:
          path: spec.template.spec.serviceAccountName
  - it: permits explicitly authorized initialization on install
    documentIndex: 5
    release:
      upgrade: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOW_INITIALIZE
            value: "true"
  - it: does not permit initialization by default
    documentIndex: 5
    set:
      cluster.managed.initialize: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOW_INITIALIZE
            value: "false"
  - it: ignores a retained initialization flag on upgrade
    documentIndex: 5
    release:
      upgrade: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOW_INITIALIZE
            value: "false"

  - it: requires HTTPS for the coordinator by default
    documentIndex: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BOOTSTRAP_HTTP
            value: "false"

  - it: permits explicit HTTP access to a legacy bootstrap member
    documentIndex: 5
    set:
      cluster.managed.bootstrapHttp: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BOOTSTRAP_HTTP
            value: "true"
