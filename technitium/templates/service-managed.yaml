{{- if eq (include "technitium.managedEnabled" .) "true" -}}
{{- $base := include "technitium.managedMemberName" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $base }}-headless
  labels:
    {{- include "technitium.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "technitium.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-member
  ports:
    - name: web-ui-https
      port: {{ .Values.ports.webHttps | default 53443 }}
      targetPort: web-ui-https
      protocol: TCP
{{- range $i := until (int (add 1 (int .Values.cluster.managed.secondaries))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $base }}-{{ $i }}-web
  labels:
    {{- include "technitium.labels" $ | nindent 4 }}
    app.kubernetes.io/component: peer-web
spec:
  type: ClusterIP
  selector:
    {{- include "technitium.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: cluster-member
    statefulset.kubernetes.io/pod-name: {{ $base }}-{{ $i }}
  ports:
    - name: web-ui-http
      port: {{ $.Values.ports.webHttp | default 5380 }}
      targetPort: web-ui-http
      protocol: TCP
    - name: web-ui-https
      port: {{ $.Values.ports.webHttps | default 53443 }}
      targetPort: web-ui-https
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "technitium.fullname" . }}-primary
  labels:
    {{- include "technitium.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  type: ClusterIP
  selector:
    {{- include "technitium.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-member
    statefulset.kubernetes.io/pod-name: {{ $base }}-{{ .Values.cluster.managed.updateTargetOrdinal }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: web-ui-https
      port: {{ .Values.ports.webHttps | default 53443 }}
      targetPort: web-ui-https
      protocol: TCP
{{- end }}
